[project]
name = "viva-server"
version = "0.1.0"
description = "Viva server: LiveKit tokens, deck prep, session config and scorecard"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "livekit-api>=1.2.2",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
